  #aviso{background:#fff4d6;color:#6b4e00;font-size:15px;padding:8px 16px;display:none}

    background:#222;color:#fff;padding:12px 18px;border-radius:14px;font-size:17px;opacity:0;transition:.25s;z-index:20;
    max-width:90vw;text-align:center;pointer-events:none}
  #toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<header><h1>¿Puedes ir a comprar hoy?</h1></header>

<main>
  <!-- LISTA -->
  <section id="vista-lista" class="vista activa">

const CATALOGO_TXT = {

const CATALOGO = [];
for (const [sec, txt] of Object.entries(CATALOGO_TXT))
  for (const n of txt.split(",")) CATALOGO.push({nombre:n, seccion:sec});

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
function el(tag, attrs={}, ...hijos){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k==="text") e.textContent=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true?"":v);
  }
  for (const h of hijos) if (h!=null) e.append(h);
  return e;
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("ver"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("ver"),2200); }
function vibrar(){ try{ navigator.vibrate && navigator.vibrate(15);}catch(e){} }

/* Adivina sección a partir del nombre */
function buscarEnCatalogo(nombre){
  const n = norm(nombre);
  const mem = memoria.get(n); if (mem) return mem;
  let exacto = CATALOGO.find(p=>norm(p.nombre)===n);
  if (exacto) return {seccion:exacto.seccion};
  // singular/plural sencillo
  const alt = n.endsWith("s") ? n.slice(0,-1) : n+"s";
  exacto = CATALOGO.find(p=>norm(p.nombre)===alt || norm(p.nombre)===n.replace(/es$/,""));
  if (exacto) return {seccion:exacto.seccion};
  // el producto del catálogo más largo que aparece dentro de lo escrito
  let mejor=null;
  for (const p of CATALOGO){
    const pn = norm(p.nombre);
    const re = new RegExp("(^|\\s)"+pn.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(s|es)?(\\s|$)");
    if (re.test(n) && (!mejor || pn.length>norm(mejor.nombre).length)) mejor=p;
  }
  if (!mejor){ // primera palabra
    const pal = n.split(" ")[0];
    if (pal.length>=4) mejor = CATALOGO.find(p=>norm(p.nombre).split(" ")[0].startsWith(pal.replace(/s$/,"")));
  }
  return {seccion: mejor ? mejor.seccion : "otros"};
}

const usarFirebase = !!FIREBASE.apiKey;
let BD;
async function iniciarBD(){
  if (usarFirebase){
    const V="10.12.2";
    const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(FIREBASE);
    let db;
    try { db = fs.initializeFirestore(app,{localCache: fs.persistentLocalCache()}); }
    catch(e){ db = fs.getFirestore(app); }
    const col = n => fs.collection(db,"familias",FAMILIA,n);
    BD = {
      escuchar(n, cb){ fs.onSnapshot(col(n), s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>{ console.error(e); aviso("No se puede conectar con la lista. Revisa internet."); }); },
      anadir(n, obj){ return fs.addDoc(col(n), obj); },
      cambiar(n, id, obj){ return fs.updateDoc(fs.doc(db,"familias",FAMILIA,n,id), obj); },
      borrar(n, id){ return fs.deleteDoc(fs.doc(db,"familias",FAMILIA,n,id)); },
      poner(n, id, obj){ return fs.setDoc(fs.doc(db,"familias",FAMILIA,n,id), obj, {merge:true}); }
    };
  } else {
    aviso("Modo prueba: la lista solo se guarda en este móvil. Cuando conectemos Firebase será compartida.");
    const oyentes={}, clave=n=>"compra_"+n;
    const leer=n=>{ try{return JSON.parse(localStorage.getItem(clave(n))||"{}");}catch(e){return {};} };
    const guardar=(n,d)=>{ try{localStorage.setItem(clave(n),JSON.stringify(d));}catch(e){} memoriaRAM[n]=d; avisar(n); };
    const memoriaRAM={};
    const datos=n=> memoriaRAM[n] || (memoriaRAM[n]=leer(n));
    const avisar=n=>(oyentes[n]||[]).forEach(cb=>cb(Object.entries(datos(n)).map(([id,v])=>({id,...v}))));
    BD = {
      escuchar(n,cb){ (oyentes[n] ||= []).push(cb); setTimeout(()=>avisar(n)); },
      async anadir(n,obj){ const d={...datos(n)}; d[Math.random().toString(36).slice(2)]=obj; guardar(n,d); },
      async cambiar(n,id,obj){ const d={...datos(n)}; if(d[id]) d[id]={...d[id],...obj}; guardar(n,d); },
      async borrar(n,id){ const d={...datos(n)}; delete d[id]; guardar(n,d); },
      async poner(n,id,obj){ const d={...datos(n)}; d[id]={...(d[id]||{}),...obj}; guardar(n,d); }
    };
  }
}

const NUMEROS={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
function interpretar(texto){
  let t = " "+texto.toLowerCase().replace(/[.¡!¿?]/g," ")+" ";
  let superDicho=null;
  if (/\b(del?|en el|en)\s+(mercadona|mercado na)\b/.test(t) || /\bmercadona\b/.test(t)) superDicho="mercadona";
  else if (/\b(del?|en el|en)\s+d[ií]a\b/.test(t)) superDicho="dia";
  t = t.replace(/\b(a|en) la lista( de la compra)?\b/g," ")
       .replace(/\b(del?|en el|en|para el|para)\s+(mercadona|mercado na|d[ií]a)\b/g," ")
       .replace(/\bmercadona\b/g," ")
       .replace(/^\s*(oye|vale|por favor)\b/g," ")
       .replace(/\b(añade|añadir|añádeme|apunta|apuntar|apúntame|pon|ponme|agrega|agregar|compra|comprar|necesitamos|necesito|hace falta|hacen falta|falta|faltan|quiero|y también|también)\b/g," ")
       .replace(/\bpor favor\b/g," ");
  const trozos = t.split(/,|;|\by\b|\be\b|\bmás\b|\bmas\b/).map(s=>s.trim()).filter(Boolean);
  return trozos.map(tr=>{
    let cantidad=1;
    const m = tr.match(/^(\d+|un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)\s+(.+)$/);
    if (m){ cantidad = NUMEROS[m[1]] || parseInt(m[1]) || 1; tr=m[2]; }
    tr = tr.replace(/^(de|el|la|los|las|unos|unas)\s+/,"").trim();
    return tr ? {nombre:tr, cantidad, super:superDicho} : null;
  }).filter(Boolean);
}

async function anadirProducto({nombre, cantidad=1, super:sup=null, seccion=null, foto="", marca="", formato="", codigo=""}){
  nombre = capital(nombre.trim());
  if (!nombre) return null;
  const n = norm(nombre);
  const ya = lista.find(i=>!i.hecho && norm(i.nombre)===n);
  if (ya){ return {repetido:true, nombre}; }
  const info = buscarEnCatalogo(nombre);
  const enBalda = balda.find(b=>norm(b.nombre)===n);
  const supFinal = sup || (filtro!=="todo" ? filtro : null) || enBalda?.super || info.super || "cualquiera";
  const tachado = lista.find(i=>i.hecho && norm(i.nombre)===n);
  const extra = {foto: foto || enBalda?.foto || "", marca: marca || enBalda?.marca || "", formato: formato || enBalda?.formato || "", codigo: codigo || enBalda?.codigo || ""};
  if (tachado){ await BD.cambiar("lista", tachado.id, {hecho:false, cantidad, super:supFinal, creado:Date.now(), ...extra}); return {nombre}; }
  await BD.anadir("lista", {nombre, cantidad, super:supFinal, seccion: seccion || enBalda?.seccion || info.seccion, hecho:false, creado:Date.now(), ...extra});
  return {nombre};
}

async function anadirTexto(texto){
  const prods = interpretar(texto);
  if (!prods.length) return;
  const hechos=[], repes=[];
  for (const p of prods){ const r = await anadirProducto(p); if(!r) continue; (r.repetido?repes:hechos).push(r.nombre); }
  vibrar();
  let msg = hechos.length ? "Apuntado: "+hechos.join(", ") : "";
  if (repes.length) msg += (msg?". ":"") + "Ya estaba: "+repes.join(", ");
  toast(msg);
}

  [/(baby)/,"bebe"],
  [/(pet-food|dog|cat-food)/,"mascotas"],
  [/(cheeses|hams|charcuteries|sausages|prepared-meats|cured)/,"charcuteria"],
  [/(milks|yogurts|dairy|dairies|desserts|creams|butters|eggs|fermented-milk|plant-based-milk)/,"lacteos"],
  [/(fishes|seafood|fish)/,"pescado"],
  [/(meats|poultry|beef|pork|chicken)/,"carne"],
  [/(breads|bakery|toasts|tortillas)/,"pan"],
  [/(coffees|teas|herbal|cocoa|breakfast|biscuits|cakes|pastries|chocolates|sweet-snacks|confectioneries|candies|honeys|spreads|jams)/,"desayuno"],
  [/(beverages|waters|sodas|juices|beers|wines|alcoholic)/,"bebidas"],
  [/(fruits|vegetables|salads|fresh)/,"fruta"]
];
function seccionDeCategorias(tags){
  if (!tags || !tags.length) return null;
  const t = tags.join(" ");
  for (const [re,sec] of MAPA_CAT) if (re.test(t)) return sec;
  return null;
}
const OFF_URL = "https://world.openfoodfacts.org/cgi/search.pl";
const OFF_CAMPOS = "code,product_name,product_name_es,brands,quantity,image_front_small_url,image_front_url,categories_tags";
let llamadas = [];
function cacheLeer(k){ try{ const v=JSON.parse(localStorage.getItem(k)); if(v && Date.now()-v.t < 7*864e5) return v.d; }catch(e){} return null; }
function cacheGuardar(k,d){ try{ localStorage.setItem(k, JSON.stringify({t:Date.now(), d})); }catch(e){} }
async function buscarOFF(q, sup){
  const clave = "off_"+sup+"_"+norm(q);
  const enCache = cacheLeer(clave); if (enCache) return enCache;
  const ahora = Date.now(); llamadas = llamadas.filter(t=>ahora-t<60000);
  if (llamadas.length >= 9) throw new Error("limite");
  llamadas.push(ahora);
  const p = new URLSearchParams({search_terms:q, tagtype_0:"stores", tag_contains_0:"contains", tag_0:sup,
    json:"1", page_size:"40", sort_by:"unique_scans_n", fields:OFF_CAMPOS, lc:"es", cc:"es", app_name:"PuedesIrAComprarHoy"});
  const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(), 20000);
  let r;
  try { r = await fetch(OFF_URL+"?"+p, {signal:ctrl.signal}); } finally { clearTimeout(to); }
  if (r.status===429) throw new Error("limite");
  if (!r.ok) throw new Error("http "+r.status);
  const j = await r.json();
  const vistos = new Set();
  const res = (j.products||[]).map(x=>{
    const nombre = (x.product_name_es || x.product_name || "").trim();
    return { codigo:x.code, nombre: nombre ? capital(nombre) : "",
      marca: (x.brands||"").split(",")[0].trim(), formato: (x.quantity||"").trim(),
      foto: x.image_front_small_url || x.image_front_url || "",
      seccion: seccionDeCategorias(x.categories_tags) || buscarEnCatalogo(nombre).seccion };
  }).filter(x=>{ const k=norm(x.nombre+"|"+x.marca+"|"+x.formato); if(!x.nombre||vistos.has(k)) return false; vistos.add(k); return true; });
  cacheGuardar(clave, res);
  return res;
}

        const yaEsta = st.puestos.has(p.codigo) || (modo==="balda" ? balda : lista_pend()).some(x=>norm(x.nombre)===norm(p.nombre));
        const tarjeta = el("button",{class:"prod"+(yaEsta?" puesto":""),"aria-label":"Añadir "+p.nombre});
        const im = imgSegura(p.foto,"",p.nombre);
        tarjeta.append(im || el("div",{class:"sinfoto",text:SEC[p.seccion]?.emo||"📦"}));
        if (im) im.addEventListener("error",()=>tarjeta.prepend(el("div",{class:"sinfoto",text:SEC[p.seccion]?.emo||"📦"})));
        tarjeta.append(el("span",{class:"pn",text:p.nombre}),
          el("span",{class:"pm",text:[p.marca,p.formato].filter(Boolean).join(" · ")}),
          el("span",{class:"pmas",text:yaEsta?"✓ Apuntado":"+ Apuntar"}));
        tarjeta.addEventListener("click",async()=>{
          if (tarjeta.classList.contains("puesto")) return;
          vibrar();
          if (modo==="balda"){
            await BD.anadir("balda",{nombre:p.nombre, seccion:p.seccion, super:st.sup, foto:p.foto, marca:p.marca, formato:p.formato, codigo:p.codigo});
            toast("En la balda: "+p.nombre);
          } else {
            const r = await anadirProducto({nombre:p.nombre, super:st.sup, seccion:p.seccion, foto:p.foto, marca:p.marca, formato:p.formato, codigo:p.codigo});
            toast(r?.repetido ? "Ya estaba en la lista" : "Apuntado: "+p.nombre);
          }
          st.puestos.add(p.codigo); tarjeta.classList.add("puesto"); tarjeta.querySelector(".pmas").textContent="✓ Apuntado";
        });
        rej.append(tarjeta);
      }
      res.append(rej);
    }
    res.append(el("div",{class:"creditos"}, document.createTextNode("Productos y fotos: "),
      el("a",{href:"https://es.openfoodfacts.org",target:"_blank",rel:"noopener",text:"Open Food Facts"}),
      document.createTextNode(" (base de datos abierta, ODbL)")));
  }
  let turno=0;
  async function lanzar(){
    const q = inp.value.trim(); st.q=q;
    if (q.length<2){ pintar(null, "Escribe lo que buscas o toca una de las sugerencias."); return; }
    const mio = ++turno;
    pintar(null, "Buscando en "+SUPERS[st.sup]+"…");
    try{
      const r = await buscarOFF(q, st.sup);
      if (mio!==turno) return;
      pintar(r, r.length ? null : `No encuentro «${q}» en ${SUPERS[st.sup]}. Prueba con otra palabra, o apúntalo sin marca con el botón de arriba.`);
    }catch(e){
      if (mio!==turno) return;
      pintar(null, e.message==="limite" ? "Has buscado muchas veces seguidas. Espera un minuto y vuelve a probar."
        : "No he podido buscar ahora mismo. Comprueba que tienes internet. (Dentro de la vista previa de Claude la búsqueda no funciona: funciona en la app instalada.)");
    }
  }
  let deb;
  inp.addEventListener("input",()=>{ clearTimeout(deb); deb=setTimeout(()=>{ if(inp.value.trim().length>=3) lanzar(); }, 1100); });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(deb); lanzar(); inp.blur(); } });

  const m = $("#modal"); m.classList.add("grande");
  abrirModal(
    el("div",{class:"cab"},
      el("button",{class:"cerrar","aria-label":"Cerrar",text:"✕",onclick:cerrarModal}),
      el("h2",{text:titulo}),
      supBox,
      el("div",{class:"busca"}, inp, el("button",{text:"Buscar",onclick:()=>{ clearTimeout(deb); lanzar(); }})),
      chips),
    res
  );
  if (textoInicial) lanzar(); else pintar(null, "Escribe lo que buscas o toca una de las sugerencias.");
}
const lista_pend = () => lista.filter(i=>!i.hecho);
$("#btn-buscar").addEventListener("click",()=>abrirBuscador("lista"));

/* ---------- caja de texto y sugerencias ---------- */
const entrada=$("#entrada"), sug=$("#sugerencias");
function enviar(){ const v=entrada.value.trim(); if(!v) return; anadirTexto(v); entrada.value=""; sug.style.display="none"; }
$("#btn-anadir").addEventListener("click",()=>{ if(entrada.value.trim()) enviar(); else entrada.focus(); });
entrada.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); enviar(); entrada.blur(); } });
entrada.addEventListener("input",()=>{
  const q=norm(entrada.value);
  sug.replaceChildren();
  if (q.length<2 || /,| y /.test(entrada.value)){ sug.style.display="none"; return; }
  const vistos=new Set(), res=[];
  const fuentes=[...balda.map(b=>({...b,deBalda:true})), ...[...memoria.values()], ...CATALOGO];
  for (const p of fuentes){
    const pn=norm(p.nombre); if(vistos.has(pn)) continue;
    if (pn.startsWith(q) || pn.includes(" "+q)){ vistos.add(pn); res.push(p); }
    if (res.length>=6) break;
  }
  for (const p of res){
    sug.append(el("button",{onmousedown:e=>e.preventDefault(),onclick:()=>{
        anadirTexto(p.nombre); entrada.value=""; sug.style.display="none"; }},
      el("span",{text:SEC[p.seccion]?.emo||"📦"}), el("span",{text:capital(p.nombre)}),
      el("small",{text:p.deBalda?"de la balda":SEC[p.seccion]?.nombre||""})));
  }
  const texto=entrada.value.trim();
  sug.append(el("button",{onmousedown:e=>e.preventDefault(),onclick:()=>{ entrada.value=""; sug.style.display="none"; abrirBuscador("lista", texto); }},
    el("span",{text:"🔎"}), el("span",{text:"Buscar «"+texto+"» con fotos"})));
  sug.style.display="block";
});
entrada.addEventListener("blur",()=>setTimeout(()=>sug.style.display="none",150));

/* ---------- micrófono ---------- */
const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
const micro=$("#micro"); let reco=null, escuchando=false;
micro.addEventListener("click",()=>{
  if (!Reco){
    entrada.focus();
    toast("Pulsa el 🎤 del teclado del iPhone y dilo: «leche, pan y huevos»");
    return;
  }
  if (escuchando){ reco.stop(); return; }
  reco = new Reco(); reco.lang="es-ES"; reco.interimResults=false; reco.maxAlternatives=1;
  reco.onstart=()=>{ escuchando=true; micro.classList.add("escuchando"); toast("Te escucho… di por ejemplo «leche y huevos»"); };
  reco.onend=()=>{ escuchando=false; micro.classList.remove("escuchando"); };
  reco.onerror=e=>{ escuchando=false; micro.classList.remove("escuchando");
    if (e.error==="not-allowed"||e.error==="service-not-allowed"){ entrada.focus(); toast("No tengo permiso del micro. Usa el 🎤 del teclado."); }
    else if (e.error==="no-speech") toast("No te he oído. Prueba otra vez."); };
  reco.onresult=e=>{ const txt=e.results[0][0].transcript; anadirTexto(txt); };
  try{ reco.start(); }catch(err){ entrada.focus(); toast("Usa el 🎤 del teclado del iPhone"); }
});

/* ---------- filtro y pestañas ---------- */
$("#filtro").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; filtro=b.dataset.super; pintarLista(); });
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("activo",x===b));
  document.querySelectorAll(".vista").forEach(v=>v.classList.toggle("activa", v.id==="vista-"+b.dataset.vista));
  window.scrollTo(0,0);
}));

/* ---------- arranque ---------- */
pintarLista(); pintarBalda();
try{
  await iniciarBD();
  BD.escuchar("lista", d=>{ lista=d; pintarLista(); pintarBalda(); });
  BD.escuchar("balda", d=>{ balda=d; pintarBalda(); });
  BD.escuchar("memoria", d=>{ memoria=new Map(d.map(x=>[x.id,{nombre:x.nombre||x.id,seccion:x.seccion,super:x.super}])); });
}catch(e){ console.error(e); aviso("No se ha podido abrir la lista. Revisa la conexión a internet."); }
</script>
